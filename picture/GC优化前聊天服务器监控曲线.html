  { id: 'users', title: '在线人数与 goroutine', unit: '个', note: '每个连接一个 goroutine，goroutine 数 ≈ 在线人数 + 5。人数回到 0 时 goroutine 回到 5，没有泄漏。',
    series: [{ k: 'online', l: '在线人数', c: 's1', area: true }, { k: 'goroutines', l: 'goroutine', c: 's2' }] },
  { id: 'cpu', title: 'CPU 占用', unit: '%', note: '粗线是 5 秒滑动平均，细线是每秒原始值。',
    series: [{ k: 'proc_cpu', m: 'proc_cpu_ma', l: '进程 CPU（100% = 一个核）', c: 's1' }, { k: 'sys_cpu', m: 'sys_cpu_ma', l: '整机 CPU（含压测程序）', c: 's2' }] },
  { id: 'mem', title: '内存', unit: 'MB', note: 'RSS 是任务管理器里的工作集；Go 栈约 16 MB，是 2000 个 goroutine 的栈。',
    series: [{ k: 'rss_mb', l: 'RSS', c: 's1' }, { k: 'heap_sys_mb', l: '堆向系统申请', c: 's2' }, { k: 'heap_inuse_mb', l: '堆 inuse', c: 's3' }, { k: 'heap_alloc_mb', l: '堆 alloc', c: 's4' }, { k: 'stack_inuse_mb', l: 'Go 栈', c: 's5' }] },
  { id: 'mallocs', title: '分配次数', unit: '次/秒', note: '优化广播拼接后，这条线应该下降。',
    series: [{ k: 'mallocs_per_sec', l: '每秒分配次数', c: 's1', area: true }] },
  { id: 'allocmb', title: '分配字节量', unit: 'MB/秒', note: '稳态约 32 MB/秒，约等于每条消息 32 KB，对应 targets 切片预留的 2000 个 net.Conn。',
    series: [{ k: 'alloc_mb_per_sec', l: '每秒分配量', c: 's2', area: true }] },
  { id: 'gc', title: 'GC 频率', unit: '次/秒', note: '稳态约每秒 2 次。',
    ymax: 4, series: [{ k: 'gc_per_sec', l: '每秒 GC 次数', c: 's3', step: true }] },
  { id: 'pause', title: 'GC 停顿', unit: 'ms/秒', note: '整个测试里只出现了两次约 0.5 ms 的停顿，对延迟几乎没有影响。',
    series: [{ k: 'gc_pause_ms', l: '每秒 GC 停顿', c: 's5', bar: true }] },
  { id: 'threads', title: '操作系统线程数', unit: '个', note: '断开后线程不会立刻回收，这是 Go 运行时的正常行为。',
    series: [{ k: 'threads', l: '线程数', c: 's4', step: true }] },
];

// 顶部统计
(function () {
  const sl = (k) => D[k].slice(iSteady0, iSteady1 + 1);
  const items = [
    [fmt(mean(sl('proc_cpu'))) + '%', '进程 CPU'],
    [fmt(mean(sl('sys_cpu'))) + '%', '整机 CPU'],
    [fmt(Math.max(...sl('rss_mb'))) + ' MB', 'RSS 峰值'],
    [fmt(mean(sl('mallocs_per_sec'))), '分配次数 / 秒'],
    [fmt(mean(sl('alloc_mb_per_sec'))) + ' MB', '分配量 / 秒'],
    [fmt(mean(sl('gc_per_sec'))), 'GC 次数 / 秒'],
  ];
  $('#stats').innerHTML = items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#n').textContent = N;
  $('#phases').innerHTML = `<span>${D.t[0]} 开始记录</span><span>爬坡 ${D.t[iRamp]} 起</span><span><i style="background:var(--band);outline:1px solid var(--rule)"></i>稳态 ${D.t[iSteady0]} – ${D.t[iSteady1]}（${iSteady1 - iSteady0 + 1} 个采样）</span><span>全部断开 ${D.t[iEnd]}</span>`;
})();

// 表格视图
(function () {
  let h = '<tr><th>时间</th><th>在线</th><th>进程 CPU %</th><th>RSS MB</th><th>分配 次/秒</th><th>GC 次/秒</th></tr>';
  for (let i = 0; i < N; i += 10) h += `<tr><td>${D.t[i]}</td><td>${D.online[i]}</td><td>${D.proc_cpu[i]}</td><td>${D.rss_mb[i]}</td><td>${D.mallocs_per_sec[i].toLocaleString('zh-CN')}</td><td>${D.gc_per_sec[i]}</td></tr>`;
  $('#tbl').innerHTML = h;
})();

// ---- 绘图 ----
const M = { l: 58, r: 14, t: 10, b: 24 };
const H = 190;
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

const state = {}; // 每个面板的几何信息，hover 用
function build() {
  const box = $('#panels');
  box.innerHTML = '';
  PANELS.forEach((P, pi) => {
    const sec = document.createElement('section');
    sec.className = 'panel'; sec.id = 'p-' + P.id;
    const legend = P.series.length > 1 ? `<div class="legend">${P.series.map((s) => `<span style="--c:var(--${s.c})">${s.l}</span>`).join('')}</div>` : '';
    sec.innerHTML = `<div class="ph"><h2>${P.title}</h2><span class="unit">${P.unit}</span>${legend}</div><p class="note">${P.note}</p><div class="svgbox"></div><div class="tip"></div>`;
    box.appendChild(sec);
  });
  draw();
}

function draw() {
  PANELS.forEach((P) => {
    const sec = $('#p-' + P.id);
    const W = Math.max(300, sec.clientWidth);
    const iw = W - M.l - M.r, ih = H - M.t - M.b;
    const X = (i) => M.l + (i / (N - 1)) * iw;
    let vmax = 0;
    P.series.forEach((s) => { vmax = Math.max(vmax, ...D[s.k]); });
    const ymax = P.ymax || niceMax(vmax * 1.06);
    const Y = (v) => M.t + ih - (v / ymax) * ih;
    const st = { W, X, Y, ymax, P };
    state[P.id] = st;

    let g = '';
    // 稳态背景带
    g += `<rect x="${X(iSteady0)}" y="${M.t}" width="${X(iSteady1) - X(iSteady0)}" height="${ih}" fill="var(--band)"/>`;
    if (P.id === 'users') g += `<text class="band-label" x="${(X(iSteady0) + X(iSteady1)) / 2}" y="${M.t + 14}" text-anchor="middle">稳态</text>`;
    // y 网格 + 刻度
    for (let k = 0; k <= 4; k++) {
      const v = (ymax / 4) * k, y = Y(v);
      g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${M.l - 8}" y="${y + 4}" text-anchor="end">${v.toLocaleString('zh-CN', { maximumFractionDigits: ymax < 5 ? 2 : 1 })}</text>`;
    }
    // x 刻度：每 30 秒
    for (let i = 0; i < N; i += (W < 600 ? 60 : 30)) {
      g += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : 'middle'}">${D.t[i].slice(3)}</text>`;
    }
    // 序列
    P.series.forEach((s, si) => {
      const col = `var(--${s.c})`;
      const pts = (arr) => arr.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
      if (s.bar) {
        D[s.k].forEach((v, i) => { if (v > 0) g += `<rect x="${X(i) - 1.5}" y="${Y(v)}" width="3" height="${Y(0) - Y(v)}" rx="1.5" fill="${col}"/>`; });
        return;
      }
      const step = (arr) => { let d = ''; arr.forEach((v, i) => { d += (i ? `H${X(i).toFixed(1)}V${Y(v).toFixed(1)}` : `M${X(i).toFixed(1)},${Y(v).toFixed(1)}`); }); return d; };
      const line = (arr) => (s.step ? step(arr) : 'M' + pts(arr).join('L'));
      if (s.area) g += `<path d="${line(D[s.k])}L${X(N - 1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${col}" fill-opacity=".14"/>`;
      if (s.m) {
        g += `<path d="${line(D[s.k])}" fill="none" stroke="${col}" stroke-opacity=".28" stroke-width="1" stroke-linejoin="round"/>`;
        g += `<path d="${line(D[s.m])}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      } else {
        g += `<path d="${line(D[s.k])}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
    });
    // 十字线
    g += `<g class="ch" style="display:none"><line y1="${M.t}" y2="${M.t + ih}" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3"/>` +
      P.series.map((s) => `<circle r="4" fill="var(--${s.c})" stroke="var(--bg)" stroke-width="2"/>`).join('') + '</g>';
    g += `<rect class="hit" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
    sec.querySelector('.svgbox').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${P.title}曲线">${g}</svg>`;

    const svg = sec.querySelector('svg');
    const hit = svg.querySelector('.hit');
    const onMove = (e) => {
      const r = svg.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * W;
      const i = Math.min(N - 1, Math.max(0, Math.round(((x - M.l) / iw) * (N - 1))));
      showAt(i, P.id);
    };
    hit.addEventListener('pointermove', onMove);
    hit.addEventListener('pointerdown', onMove);
    hit.addEventListener('pointerleave', hideAll);
  });
}

function showAt(i, host) {
  PANELS.forEach((P) => {
    const st = state[P.id]; const sec = $('#p-' + P.id);
    const ch = sec.querySelector('.ch'); if (!ch) return;
    ch.style.display = '';
    ch.querySelector('line').setAttribute('x1', st.X(i)); ch.querySelector('line').setAttribute('x2', st.X(i));
    ch.querySelectorAll('circle').forEach((c, si) => {
      const s = P.series[si]; const v = D[s.m || s.k][i];
      c.setAttribute('cx', st.X(i)); c.setAttribute('cy', st.Y(v));
    });
  });
  const P = PANELS.find((p) => p.id === host); const st = state[host]; const sec = $('#p-' + host); const tip = sec.querySelector('.tip');
  tip.style.setProperty('--c', 'var(--ink)');
  tip.innerHTML = `<div class="t">${D.t[i]} · 在线 ${D.online[i]}</div>` + P.series.map((s) => {
    const v = D[s.m || s.k][i]; const raw = s.m ? ` <small>（当秒 ${fmt(D[s.k][i])}）</small>` : '';
    return `<div class="r" style="--c:var(--${s.c})"><em>${s.l.replace(/（.*?）/, '')}</em><span>${fmt(v)} ${P.unit}${raw}</span></div>`;
  }).join('');
  tip.style.display = 'block';
  const x = st.X(i), tw = tip.offsetWidth;
  const left = x + 14 + tw > st.W ? x - 14 - tw : x + 14;
  tip.style.left = Math.max(0, left) + 'px';
  tip.style.top = (sec.querySelector('.svgbox').offsetTop + M.t + 6) + 'px';
}
function hideAll() {
  document.querySelectorAll('.ch').forEach((c) => (c.style.display = 'none'));
  document.querySelectorAll('.tip').forEach((t) => (t.style.display = 'none'));
}

build();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(draw, 60); }).observe(document.querySelector('.wrap'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>

</body></html>
